# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name freellmapi.essentjus.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name freellmapi.essentjus.com.br;

    client_max_body_size 32m;

    # Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/freellmapi.essentjus.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freellmapi.essentjus.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # FreeLLMAPI fica só em localhost — nginx termina TLS
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket + SSE (streaming /v1)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering         off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering "no" always;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
